name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-website-auditor .
      - name: Smoke test container
        run: |
          docker run -d --name app -p 3000:3000 ai-website-auditor
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS http://localhost:3000/ | grep -q "AI Website Auditor"
          docker logs app
