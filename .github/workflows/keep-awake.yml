# Free Render instances fall asleep after 15 minutes without traffic; the next
# visitor then waits ~50 s. This pings the health endpoint every 10 minutes
# so real visitors (and Google's reviewers) always get a fast page.
name: Keep awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -o /dev/null -m 90 --retry 2 -w '%{http_code} %{time_total}s\n' https://auditeur-seo.fr/api/health
