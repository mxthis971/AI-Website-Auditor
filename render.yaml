# Render Blueprint: https://render.com/docs/blueprint-spec
# Free web service. Secrets (API keys) are set in the Render dashboard,
# never in this file.
services:
  - type: web
    name: nig-seo-auditor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: PAGESPEED_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_REPORT_PRICE_ID
        sync: false
      # Google AdSense publisher ID (ca-pub-…) and optional report banner slot ID.
      # Public IDs (not secrets): AdSense publisher and Search Console token.
      - key: ADSENSE_CLIENT
        value: ca-pub-7857466062981714
      - key: ADSENSE_REPORT_SLOT
        sync: false
      - key: ADSENSE_TOOL_SLOT
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        value: fNjVqyjB8GHfwjI-3BhX8GqGn4vTqUeeVGNoQnANeFA
